name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行测试
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q --basetemp=./.pytest-tmp -ra 2>&1 | tee pytest.log
      - name: 上传 pytest 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/pytest.log
      - name: 展示 pytest 失败摘要
        if: failure()
        working-directory: backend
        run: |
          {
            echo '### pytest 失败日志'
            echo '```text'
            tail -n 80 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: 前端类型检查 (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        working-directory: frontend
        # 该项目锁定了较新/预览版工具链（TS 7、Vite 8 等），用 legacy-peer-deps 规避 peer 冲突。
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
