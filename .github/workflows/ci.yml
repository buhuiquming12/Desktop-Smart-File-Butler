name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行测试
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q --basetemp=./.pytest-tmp -ra 2>&1 | tee pytest.log
      - name: 上传 pytest 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/pytest.log
      - name: 展示 pytest 失败摘要
        if: failure()
        working-directory: backend
        run: |
          {
            echo '### pytest 失败日志'
            echo '```text'
            tail -n 80 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done < pytest.log

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 运行前端状态测试
        working-directory: frontend
        run: npm test
      - name: 构建 Web 与 Electron 主进程
        working-directory: frontend
        run: npm run build:web

  desktop:
    name: Windows sidecar 与 Electron 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端与前端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend
          npm ci --no-audit --no-fund
      - name: 构建前端
        working-directory: frontend
        run: npm run build:web
      - name: 构建 Python sidecar
        run: python backend/build_sidecar.py
      - name: Sidecar smoke test
        run: backend/dist/butler-backend.exe --self-test
      - name: 构建 Electron unpacked 包
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-unpacked
          path: frontend/release/win-unpacked
